

services:
  postgres:
    image: postgres:16
    container_name: neowallet-postgres
    restart: always
    environment:
      POSTGRES_USER: neowallet
      POSTGRES_PASSWORD: neowallet
      POSTGRES_DB: neowallet
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: neowallet-redis
    restart: always
    ports:
      - "6379:6379"